name: Release

# Releases are cut by pushing a semver tag, e.g.:
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
# Merges to main (including Dependabot bumps) no longer publish anything.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # Run the full CI suite (lint, govulncheck, tests on Linux + macOS,
    # snapshot build) against the tagged commit before publishing.
    # Switch to `$/.github/workflows/ci.yml` once actionlint supports
    # GitHub's self-repository syntax (v1.7.12 rejects it).
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC token for signing build provenance
      attestations: write # store the provenance attestation
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs full history and tags for the changelog.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # No cache for release builds: always build from a clean module
          # download (also avoids cache-poisoning concerns).
          cache: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        # Lets users verify a binary was built by this workflow from this
        # repo: gh attestation verify <file> -R kubevoidcraft/weather-tui
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
