# Dependabot keeps our Go modules and GitHub Actions pinned versions fresh so
# CVE-affected releases are picked up without manual bookkeeping. Updates are
# grouped weekly to avoid PR noise; critical security advisories still open
# individual PRs via GitHub's security-update flow.
#
# Actions are pinned by commit SHA with a "# vX.Y.Z" comment; Dependabot
# updates both together.
#
# cooldown delays version updates until a release has been public for a few
# days, so a compromised release is more likely to be caught and yanked
# before we pick it up. Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      ci-actions:
        patterns:
          - "*"
